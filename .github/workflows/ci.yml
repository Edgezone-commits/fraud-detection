name: CI

# Run the test suite on every push and every pull request.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      # CI has no dataset and no trained model (both are gitignored), so tests that need
      # them are skipped and reported as SKIPPED. Everything else must pass.
      - name: Run tests
        run: pytest -q -rs
